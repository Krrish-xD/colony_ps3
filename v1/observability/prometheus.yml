global:
  scrape_interval: 2s     # Aggressive for <15s hackathon SLA
  evaluation_interval: 2s # Evaluates alerts fast

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "/etc/prometheus/rules.yml"

scrape_configs:
  - job_name: "otel-collector"
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]
    metric_relabel_configs:
      # CRITICAL: OTel standard maps service identity to `job` in prometheus exporter.
      # We explicitly alias it to `service` so our RCA webhook contract receives {"service": "..."} natively.
      - source_labels: [job]
        target_label: service
        action: replace
