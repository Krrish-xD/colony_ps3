receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 200ms
    send_batch_size: 100
  resource:
    attributes:
      # Ensure service.name is consistently mapped to service and app for all outputs (Loki & Prometheus).
      - key: service
        from_attribute: service.name
        action: insert
      - key: app
        from_attribute: service.name
        action: insert

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: ""
    resource_to_telemetry_conversion:
      enabled: true

  loki:
    endpoint: "http://loki:3100/loki/api/v1/push"
    default_labels_enabled:
      exporter: false
      job: false
    # The loki exporter doesn't automatically map all resource attributes to loki labels.
    # We explicitly promote `app` and `service` so LogQL queries like `{app="payment-service"}` work flawlessly.
    labels:
      attributes:
        app: "app"
        service: "service"

  otlp/jaeger:
    endpoint: "jaeger:4317"
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [loki]
