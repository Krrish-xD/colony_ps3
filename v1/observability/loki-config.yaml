auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  path_prefix: /tmp/loki
  storage:
    filesystem:
      chunks_directory: /tmp/loki/chunks
      rules_directory: /tmp/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  ingestion_rate_mb: 50
  ingestion_burst_size_mb: 100
  max_entries_limit_per_query: 10000
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # AGGRESSIVE TUNING FOR <15s DEMO LATENCY BUDGET
  # Force flush every 100ms or 100KB to ensure logs hit the query path instantly
  per_stream_rate_limit: 50MB
  per_stream_rate_limit_burst: 100MB

chunk_store_config:
  max_look_back_period: 0s

ingester:
  # AGGRESSIVE TUNING FOR DEMO
  chunk_idle_period: 1m
  chunk_block_size: 100000  # ~100KB
  chunk_retain_period: 1m
  max_transfer_retries: 0
  lifecycler:
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    final_sleep: 0s
