route:
  group_by: ['alertname', 'service']
  group_wait: 1s      # Wait only 1 second to bundle alerts
  group_interval: 1s  # Re-send grouped alerts fast
  repeat_interval: 1m # Doesn't matter much for a 15s hackathon SLA, but prevents complete flooding
  receiver: 'rca-engine-webhook'

receivers:
  - name: 'rca-engine-webhook'
    webhook_configs:
      - url: 'http://intelligence:8000/alert'
        send_resolved: true
        # The payload will look like this, which satisfies the JSON contract for Agent D:
        # {
        #   "alerts": [
        #     {
        #       "labels": {
        #         "service": "payment-service",
        #         "metric": "http_requests_total",
        #         "severity": "critical"
        #       },
        #       "startsAt": "2023-10-27T10:00:00Z"
        #     }
        #   ]
        # }
